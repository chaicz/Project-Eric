<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Eric — Security-First Web IDE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply persisted theme before React mounts to prevent flash of wrong theme -->
    <script>
      (function () {
        try {
          // The key the app writes ('project-eric_theme'), not
          // 'project_eric_theme' — the old spelling never matched, so
          // the saved theme was ignored here.
          var t = localStorage.getItem('project-eric_theme');
          var dark = t === 'dark';
          if (t === 'system' && window.matchMedia) {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
